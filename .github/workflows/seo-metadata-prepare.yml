name: Prepare verified SEO metadata
'on':
  push:
    branches:
    - seo-metadata-prepare-20261112
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 5161931395ebbd77014b00467f586d2e0ca7bf4d
        fetch-depth: 1
    - name: Apply and verify approved metadata patch
      shell: bash
      run: "set -euo pipefail\nexpected=5161931395ebbd77014b00467f586d2e0ca7bf4d\ntest \"$(git ls-remote origin refs/heads/main | cut -f1)\" = \"$expected\"\npython3 - <<'PYTHON'\nfrom pathlib import Path\nimport base64,hashlib,re,subprocess\np=Path('index.html')\nold=p.read_bytes()\nassert hashlib.sha256(old).hexdigest() == '48d339d4f4b504a1db122e9d7f7cf01afdf59abf56ea5f9501b20cc0e65f3004', 'Source changed'\npatch=base64.b64decode('')\nsubprocess.run(['git','apply','--check','-'],input=patch,check=True)\nsubprocess.run(['git','apply','-'],input=patch,check=True)\nnew=p.read_bytes()\nassert hashlib.sha256(new).hexdigest() == '33c5c41340d5676e4af7139d3e780c36ab3523a30d0e831a780612a55a8a1092', 'Unexpected patch result'\nassert old[old.lower().index(b'<body'):] == new[new.lower().index(b'<body'):], 'Body changed'\nfor tag in [b'style',b'script']:\n    assert re.findall(b'<'+tag+br'\\b.*?</'+tag+b'>',old,re.S) == re.findall(b'<'+tag+br'\\b.*?</'+tag+b'>',new,re.S), 'Style/script changed'\nPYTHON\ngit diff --check\ntest \"$(git diff --name-only)\" = \"index.html\"\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add -- index.html\ngit commit -m 'Add study guide search and sharing metadata'\ntest \"$(git ls-remote origin refs/heads/main | cut -f1)\" = \"$expected\"\ngit push origin HEAD:refs/heads/seo-metadata-candidate-20261112\n"
